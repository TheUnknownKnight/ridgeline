name: Mobile & Web CI (com.nickb.ridgeline)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (integer; increment for every Google Play upload)'
        required: false
        default: '1'
      ios_build_number:
        description: 'iOS CFBundleVersion build number (integer; increment for every TestFlight/App Store upload)'
        required: false
        default: '1'

jobs:
  test-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  android:
    needs: test-and-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build Android debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ridgeline-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  android-release:
    needs: test-and-web
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Decode upload keystore (if configured)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ridgeline-upload.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$RUNNER_TEMP/ridgeline-upload.jks" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; building unsigned AAB."
          fi
      - name: Build Android release AAB
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ inputs.version_code || '1' }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew bundleRelease
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ridgeline-upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.keystore.outputs.signed == 'true' && 'ridgeline-android-release-signed-aab' || 'ridgeline-android-release-unsigned-aab' }}
          path: android/app/build/outputs/bundle/release/*.aab

  ios:
    needs: test-and-web
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build iOS (unsigned simulator verification)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios-release:
    needs: test-and-web
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Check App Store Connect API credentials
        id: asc
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          key_raw="$APP_STORE_CONNECT_API_KEY_P8_BASE64"
          key_id="$(printf '%s' "$APP_STORE_CONNECT_KEY_ID" | tr -d '[:space:]')"
          issuer_id="$(printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '[:space:]')"
          if [ -n "$key_raw" ] && [ -n "$key_id" ] && [ -n "$issuer_id" ]; then
            key_path="$RUNNER_TEMP/asc_auth_key.p8"
            KEY_PATH="$key_path" node - <<'EOF'
          const fs = require('node:fs');
          const raw = (process.env.APP_STORE_CONNECT_API_KEY_P8_BASE64 || '').trim();
          let pemText = raw.includes('BEGIN PRIVATE KEY')
            ? raw
            : Buffer.from(raw.replace(/\s+/g, ''), 'base64').toString('utf8');
          pemText = pemText.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
          if (pemText && !pemText.endsWith('\n')) pemText += '\n';
          fs.writeFileSync(process.env.KEY_PATH, pemText, { mode: 0o600 });
          const bytes = Buffer.byteLength(pemText, 'utf8');
          const hasPemHeader = pemText.includes('-----BEGIN PRIVATE KEY-----');
          const hasPemFooter = pemText.includes('-----END PRIVATE KEY-----');
          console.log(`Decoded API key: ${bytes} bytes, hasPemHeader=${hasPemHeader}, hasPemFooter=${hasPemFooter}`);
          EOF
            if ! openssl pkey -in "$key_path" -noout >/dev/null 2>&1; then
              echo "::error::APP_STORE_CONNECT_API_KEY_P8_BASE64 did not decode to a valid PKCS#8 .p8 private key. Re-save the secret using Base64 encoding of your downloaded AuthKey_*.p8 file."
              exit 1
            fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Missing APP_STORE_CONNECT_API_KEY_P8_BASE64, APP_STORE_CONNECT_KEY_ID, or APP_STORE_CONNECT_ISSUER_ID; skipping App Store Connect upload."
          fi
      - name: Archive iOS app
        if: steps.asc.outputs.configured == 'true'
        working-directory: ios/App
        env:
          IOS_BUILD_NUMBER: ${{ inputs.ios_build_number || '1' }}
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ridgeline.xcarchive" \
            CURRENT_PROJECT_VERSION="${IOS_BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO
      - name: Cloud-sign and upload to App Store Connect
        if: steps.asc.outputs.configured == 'true'
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Ridgeline.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_auth_key.p8" \
            -authenticationKeyID "$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')" \
            -authenticationKeyIssuerID "$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
      - name: Remove temporary API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_auth_key.p8" "$RUNNER_TEMP"/AuthKey_*.p8
